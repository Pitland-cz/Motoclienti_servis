<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Servisní kniha – Motoclienti</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://jxrgmedujtxukgsllich.supabase.co/storage/v1/object/public/mc-app/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111114">
<style>
:root{
  --bg:#111114; --panel:#1b1b20; --panel2:#242430; --line:#32323e;
  --txt:#f2f2f5; --mut:#9a9aa8; --red:#e11d2a; --red-dk:#a8121d;
  --grn:#2ea052; --yel:#e0a63c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px}
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:130px}
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:17px;font-weight:700;flex:1}
header .sub{font-size:11px;color:var(--mut);display:block;font-weight:400}
.chip{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;color:var(--mut)}
main{flex:1;padding:14px 14px 0}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 2px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--panel2)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.title{font-weight:650}
.mut{color:var(--mut);font-size:13px}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;border:none;border-radius:12px;cursor:pointer;color:var(--txt)}
.btn{background:var(--panel2);border:1px solid var(--line);padding:11px 15px;font-weight:600;font-size:14.5px}
.btn:active{opacity:.75}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.full{width:100%;margin-top:8px}
input,textarea,select{font:inherit;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 12px;margin-top:6px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--red);border-color:transparent}
label{font-size:13px;color:var(--mut);display:block;margin-top:12px}
.badge{font-size:11px;padding:3px 8px;border-radius:12px;font-weight:700}
.badge.warn{background:rgba(224,166,60,.15);color:var(--yel);border:1px solid rgba(224,166,60,.4)}
.badge.grn{background:rgba(46,160,82,.15);color:var(--grn)}
.tabs{display:flex;gap:6px;margin:4px 0 14px}
.tabs button{flex:1;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--mut);font-weight:650;font-size:14px}
.tabs button.on{background:var(--panel2);color:var(--txt);border-color:#4a4a5a}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
/* mic */
#micWrap{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:0;right:0;display:flex;justify-content:center;z-index:20;pointer-events:none}
#micBtn{pointer-events:auto;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 32% 30%, #ff4553, var(--red) 55%, var(--red-dk));box-shadow:0 6px 24px rgba(225,29,42,.45), inset 0 -3px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;transition:transform .12s}
#micBtn:active{transform:scale(.93)}
#micBtn.rec{animation:pulse 1.1s infinite}
#micBtn svg{width:36px;height:36px;fill:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,29,42,.55)}70%{box-shadow:0 0 0 26px rgba(225,29,42,0)}100%{box-shadow:0 0 0 0 rgba(225,29,42,0)}}
#micHint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 108px);left:0;right:0;text-align:center;font-size:12.5px;color:var(--mut);z-index:20;pointer-events:none}
/* sheet + modal */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:var(--panel);border-radius:20px 20px 0 0;max-width:640px;width:100%;max-height:86vh;overflow-y:auto;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet h3{font-size:17px;margin-bottom:12px}
/* login */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
#login img{width:88px;height:88px;border-radius:22px}
#login h1{font-size:20px}
#pinDots{display:flex;gap:14px;height:16px}
#pinDots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}
#pinDots span.f{background:var(--red);border-color:var(--red)}
#pad{display:grid;grid-template-columns:repeat(3,74px);gap:12px}
#pad button{height:64px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:24px;font-weight:600}
#pad button:active{background:var(--panel2)}
.err{color:var(--red);font-size:14px;min-height:20px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;z-index:60;font-size:14px;max-width:88%;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.photoThumb{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.todoRow{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line)}
.todoRow:last-child{border-bottom:none}
.chk{width:26px;height:26px;min-width:26px;border-radius:8px;border:2px solid var(--mut);margin-top:1px;display:flex;align-items:center;justify-content:center}
.chk.d{background:var(--grn);border-color:var(--grn)}
</style>
</head>
<body>

<div id="login">
  <img src="https://jxrgmedujtxukgsllich.supabase.co/storage/v1/object/public/mc-app/icon-192.png" alt="">
  <h1>Servisní kniha<br><span style="color:var(--mut);font-size:15px;font-weight:400">Motoclienti</span></h1>
  <div id="pinDots"><span></span><span></span><span></span><span></span></div>
  <div class="err" id="pinErr"></div>
  <div id="pad"></div>
</div>

<div id="app" class="hide">
  <header>
    <div class="grow">
      <h1 id="hdTitle">Servisní kniha <span class="sub">Motoclienti</span></h1>
    </div>
    <span class="chip" id="hdUser"></span>
    <button class="btn sm ghost" onclick="logout()" title="Odhlásit">⎋</button>
  </header>
  <main id="main"></main>
</div>

<div id="micWrap" class="hide"><button id="micBtn" onclick="toggleRec()">
  <svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2z"/></svg>
</button></div>
<div id="micHint" class="hide">Ťukni a nadiktuj záznam</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.39.3/supabase.min.js"></script>
<script>
const SUPA_URL='https://jxrgmedujtxukgsllich.supabase.co';
const SUPA_KEY='sb_publishable_m2nJiLNYO8QPlm6Je5HNAw_7WJZsmi5';
const FN_URL=SUPA_URL+'/functions/v1/mc-dictate';
const db=supabase.createClient(SUPA_URL,SUPA_KEY);

let user=null, view={name:'home'}, tab='moto';
let clients=[], bikes=[], todos=[];

/* ---------- utils ---------- */
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg,ms=2600){const t=document.createElement('div');t.id='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
const fmtD=d=>{if(!d)return'';const[y,m,dd]=d.split('-');return`${+dd}.${+m}.${y}`;};
const bikeLabel=b=>{const c=clients.find(c=>c.id===b.client_id);return`${b.start_number?b.start_number+' – ':''}${b.brand_model}${c?' ('+c.name+')':''}`;};

/* ---------- login ---------- */
let pin='';
(function(){const pad=$('pad');'123456789⌫0✓'.split('').forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>padKey(k);pad.appendChild(b);});})();
function drawDots(){[...$('pinDots').children].forEach((s,i)=>s.className=i<pin.length?'f':'');}
async function padKey(k){
  $('pinErr').textContent='';
  if(k==='⌫'){pin=pin.slice(0,-1);drawDots();return;}
  if(k==='✓'){return tryLogin();}
  if(pin.length<4){pin+=k;drawDots();if(pin.length===4)tryLogin();}
}
async function tryLogin(){
  const{data,error}=await db.rpc('mc_login',{p_pin:pin});
  pin='';drawDots();
  if(error||!data||!data.length){$('pinErr').textContent='Špatný PIN';return;}
  user=data[0];localStorage.setItem('mc_user',JSON.stringify(user));
  enter();
}
function logout(){localStorage.removeItem('mc_user');location.reload();}
async function enter(){
  $('login').classList.add('hide');$('app').classList.remove('hide');
  $('micWrap').classList.remove('hide');$('micHint').classList.remove('hide');
  $('hdUser').textContent=user.code;
  await loadAll();
  if(user.role!=='admin')tab='ukoly';
  render();
}

/* ---------- data ---------- */
async function loadAll(){
  const[c,b,t]=await Promise.all([
    db.from('mc_clients').select('*').order('name'),
    db.from('mc_bikes').select('*').order('start_number'),
    db.from('mc_todos').select('*').order('created_at',{ascending:false}),
  ]);
  clients=c.data||[];bikes=b.data||[];todos=t.data||[];
}

/* ---------- render ---------- */
function render(){
  const m=$('main');
  if(view.name==='bike')return renderBike(m);
  // home
  let h='';
  if(user.role==='admin'){
    h+=`<div class="tabs">
      <button class="${tab==='moto'?'on':''}" onclick="tab='moto';render()">Motorky</button>
      <button class="${tab==='ukoly'?'on':''}" onclick="tab='ukoly';render()">Úkoly${openTodos().length?` (${openTodos().length})`:''}</button>
    </div>`;
  }
  if(tab==='moto'&&user.role==='admin'){
    h+=`<div class="row" style="margin-bottom:10px;gap:8px">
      <button class="btn sm" onclick="openClientForm()">+ Klient</button>
      <button class="btn sm" onclick="openBikeForm()">+ Motorka</button>
    </div>`;
    if(!clients.length)h+=`<div class="card mut">Zatím žádní klienti. Přidej prvního tlačítkem výše, nebo prostě nadiktuj záznam — jméno a motorku pak přiřadíš.</div>`;
    for(const c of clients){
      const cb=bikes.filter(b=>b.client_id===c.id);
      h+=`<div class="card"><div class="row"><div class="grow title">${esc(c.name)}</div><span class="mut small">${cb.length} moto</span></div>`;
      for(const b of cb){
        const nt=openTodos().filter(t=>t.bike_id===b.id).length;
        h+=`<div class="row" style="padding:9px 0 0;cursor:pointer" onclick="view={name:'bike',id:'${b.id}'};render()">
          <div class="grow"><span class="title" style="font-weight:600">${esc(b.start_number?b.start_number+' – ':'')}${esc(b.brand_model)}</span></div>
          ${nt?`<span class="badge warn">${nt} úkol${nt>1?'y':''}</span>`:''}
          <span class="mut">›</span></div>`;
      }
      h+=`</div>`;
    }
  }else{ // úkoly
    const ot=openTodos();
    h+=`<div class="row" style="margin-bottom:6px">
      <div class="grow"><h2 style="margin:0">Úkoly k udělání</h2></div>
      ${ot.length?`<button class="btn sm" onclick="shareTodos()">Sdílet ↗</button>`:''}
    </div>`;
    if(!ot.length)h+=`<div class="card mut">Žádné otevřené úkoly. 👍</div>`;
    else{h+=`<div class="card">`;
      for(const t of ot){
        const b=bikes.find(x=>x.id===t.bike_id);
        h+=`<div class="todoRow">
          <div class="chk" onclick="finishTodo('${t.id}')"></div>
          <div class="grow"><div>${esc(t.task)} ${t.needs_review?'<span class="badge warn">ověřit</span>':''}</div>
          <div class="mut small">${b?esc(bikeLabel(b)):'— nezařazeno —'}</div></div>
        </div>`;
      }h+=`</div>`;}
    const dn=todos.filter(t=>t.done).slice(0,10);
    if(dn.length){h+=`<h2>Hotovo (posledních 10)</h2><div class="card">`;
      for(const t of dn){const b=bikes.find(x=>x.id===t.bike_id);
        h+=`<div class="todoRow"><div class="chk d">✓</div><div class="grow mut"><div style="text-decoration:line-through">${esc(t.task)}</div><div class="small">${b?esc(bikeLabel(b)):''}</div></div></div>`;}
      h+=`</div>`;}
  }
  m.innerHTML=h;
}
const openTodos=()=>todos.filter(t=>!t.done);

async function renderBike(m){
  const b=bikes.find(x=>x.id===view.id);
  if(!b){view={name:'home'};return render();}
  const c=clients.find(x=>x.id===b.client_id);
  m.innerHTML=`<div class="spin"></div>`;
  const{data:recs}=await db.from('mc_service_records').select('*').eq('bike_id',b.id).order('record_date',{ascending:false}).order('created_at',{ascending:false});
  const bt=openTodos().filter(t=>t.bike_id===b.id);
  let h=`<button class="btn sm ghost" onclick="view={name:'home'};render()" style="margin-bottom:8px">‹ Zpět</button>
  <div class="card"><div class="title" style="font-size:18px">${esc(b.start_number?b.start_number+' – ':'')}${esc(b.brand_model)}</div>
  <div class="mut">${esc(c?.name??'')}${b.note?' · '+esc(b.note):''}</div>
  ${user.role==='admin'?`<div class="row" style="margin-top:10px;gap:8px"><button class="btn sm" onclick="openRecForm('${b.id}')">+ Ruční záznam</button><button class="btn sm ghost" onclick="editBike('${b.id}')">Upravit</button></div>`:''}
  </div>`;
  if(bt.length){h+=`<h2>Úkoly na této motorce</h2><div class="card">`;
    for(const t of bt)h+=`<div class="todoRow"><div class="chk" onclick="finishTodo('${t.id}')"></div><div class="grow">${esc(t.task)}</div></div>`;
    h+=`</div>`;}
  h+=`<h2>Historie servisu</h2>`;
  if(!recs?.length)h+=`<div class="card mut">Zatím žádné záznamy.</div>`;
  else{h+=`<div class="card" style="padding:6px 10px"><table><tr><th>Datum</th><th>Km</th><th>Co bylo uděláno</th><th></th></tr>`;
    for(const r of recs){
      h+=`<tr${r.needs_review?' style="background:rgba(224,166,60,.07)"':''}>
      <td class="num" style="white-space:nowrap">${fmtD(r.record_date)}</td>
      <td class="num">${r.odometer_km??'–'}</td>
      <td>${esc(r.work_done)}${r.needs_review?' <span class="badge warn">ověřit</span>':''}
        ${(r.photo_urls||[]).map(u=>`<br><a href="${esc(u)}" target="_blank"><img class="photoThumb" src="${esc(u)}"></a>`).join('')}</td>
      <td><button class="btn sm ghost" onclick="addPhoto('${r.id}')">📷</button></td></tr>`;
    }
    h+=`</table></div>`;}
  m.innerHTML=h;
}

/* ---------- forms ---------- */
function sheet(html){
  const s=document.createElement('div');s.className='sheet';s.id='sheet';
  s.innerHTML=`<div class="inner">${html}</div>`;
  s.onclick=e=>{if(e.target===s)s.remove();};
  document.body.appendChild(s);
}
const closeSheet=()=>$('sheet')?.remove();

function openClientForm(){
  sheet(`<h3>Nový klient</h3>
  <label>Jméno (např. Jiří M.)</label><input id="fName">
  <label>Poznámka</label><input id="fNote">
  <button class="btn red full" onclick="saveClient()">Uložit</button>`);
}
async function saveClient(){
  const name=$('fName').value.trim();if(!name)return toast('Zadej jméno');
  await db.from('mc_clients').insert({name,note:$('fNote').value.trim()||null});
  closeSheet();await loadAll();render();toast('Klient přidán');
}
function openBikeForm(){
  if(!clients.length)return toast('Nejdřív přidej klienta');
  sheet(`<h3>Nová motorka</h3>
  <label>Klient</label><select id="fClient">${clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
  <label>Startovní číslo (např. 415)</label><input id="fNum" inputmode="numeric">
  <label>Značka a model (např. Aprilia RS660)</label><input id="fModel">
  <label>Poznámka</label><input id="fNote">
  <button class="btn red full" onclick="saveBike()">Uložit</button>`);
}
async function saveBike(){
  const brand_model=$('fModel').value.trim();if(!brand_model)return toast('Zadej značku a model');
  await db.from('mc_bikes').insert({client_id:$('fClient').value,start_number:$('fNum').value.trim()||null,brand_model,note:$('fNote').value.trim()||null});
  closeSheet();await loadAll();render();toast('Motorka přidána');
}
function editBike(id){
  const b=bikes.find(x=>x.id===id);
  sheet(`<h3>Upravit motorku</h3>
  <label>Startovní číslo</label><input id="fNum" value="${esc(b.start_number??'')}">
  <label>Značka a model</label><input id="fModel" value="${esc(b.brand_model)}">
  <label>Poznámka</label><input id="fNote" value="${esc(b.note??'')}">
  <button class="btn red full" onclick="updBike('${id}')">Uložit</button>
  <button class="btn full ghost" style="color:var(--red)" onclick="delBike('${id}')">Smazat motorku</button>`);
}
async function updBike(id){
  await db.from('mc_bikes').update({start_number:$('fNum').value.trim()||null,brand_model:$('fModel').value.trim(),note:$('fNote').value.trim()||null}).eq('id',id);
  closeSheet();await loadAll();render();
}
async function delBike(id){
  if(!confirm('Smazat motorku včetně historie?'))return;
  await db.from('mc_bikes').delete().eq('id',id);
  closeSheet();view={name:'home'};await loadAll();render();
}
function openRecForm(bikeId){
  sheet(`<h3>Ruční záznam servisu</h3>
  <label>Datum</label><input id="fDate" type="date" value="${new Date().toISOString().slice(0,10)}">
  <label>Najeté km</label><input id="fKm" inputmode="numeric">
  <label>Co bylo uděláno</label><textarea id="fWork" rows="3"></textarea>
  <button class="btn red full" onclick="saveRec('${bikeId}')">Uložit</button>`);
}
async function saveRec(bikeId){
  const work=$('fWork').value.trim();if(!work)return toast('Popiš, co bylo uděláno');
  await db.from('mc_service_records').insert({bike_id:bikeId,record_date:$('fDate').value,odometer_km:parseInt($('fKm').value)||null,work_done:work,created_by:user.code});
  closeSheet();render();toast('Záznam uložen');
}

/* ---------- todos ---------- */
async function finishTodo(id){
  await db.from('mc_todos').update({done:true,done_at:new Date().toISOString(),done_by:user.code}).eq('id',id);
  await loadAll();render();toast('Úkol hotov ✓');
}
function shareTodos(){
  const ot=openTodos();
  let txt='ÚKOLY – Servisní kniha Motoclienti\n';
  for(const t of ot){const b=bikes.find(x=>x.id===t.bike_id);
    txt+=`• ${b?(b.start_number?b.start_number+' ':'')+b.brand_model+': ':''}${t.task}\n`;}
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else{navigator.clipboard.writeText(txt);toast('Zkopírováno — vlož do WhatsAppu');}
}

/* ---------- photos ---------- */
function addPhoto(recId){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    toast('Nahrávám fotku…',6000);
    const path=`${recId}/${Date.now()}.jpg`;
    const{error}=await db.storage.from('mc-photos').upload(path,f,{contentType:f.type||'image/jpeg'});
    if(error)return toast('Chyba nahrání: '+error.message);
    const url=db.storage.from('mc-photos').getPublicUrl(path).data.publicUrl;
    const{data:rec}=await db.from('mc_service_records').select('photo_urls').eq('id',recId).single();
    await db.from('mc_service_records').update({photo_urls:[...(rec.photo_urls||[]),url]}).eq('id',recId);
    render();toast('Fotka uložena');
  };
  inp.click();
}

/* ---------- dictation ---------- */
let rec=null,chunks=[],recMime='';
function pickMime(){
  for(const m of['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'])
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;
  return'';
}
async function toggleRec(){
  if(rec&&rec.state==='recording'){rec.stop();return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recMime=pickMime();chunks=[];
    rec=new MediaRecorder(stream,recMime?{mimeType:recMime}:undefined);
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      $('micBtn').classList.remove('rec');$('micHint').textContent='Zpracovávám…';
      const blob=new Blob(chunks,{type:recMime||'audio/webm'});
      if(blob.size<2000){$('micHint').textContent='Ťukni a nadiktuj záznam';return toast('Moc krátká nahrávka');}
      await sendDictation(blob);
      $('micHint').textContent='Ťukni a nadiktuj záznam';
    };
    rec.start();
    $('micBtn').classList.add('rec');$('micHint').textContent='● Nahrávám — ťukni pro konec';
  }catch(e){toast('Mikrofon nedostupný: '+e.message);}
}
function blobToB64(blob){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(blob);});}

async function sendDictation(blob){
  const audio_base64=await blobToB64(blob);
  const payload={
    audio_base64,mime_type:recMime||'audio/webm',user_code:user.code,
    bikes:bikes.map(b=>({id:b.id,label:bikeLabel(b)})),
  };
  let out;
  try{
    const r=await fetch(FN_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPA_KEY,'apikey':SUPA_KEY},body:JSON.stringify(payload)});
    out=await r.json();
    if(out.error)throw new Error(out.error);
  }catch(e){return toast('Chyba zpracování: '+e.message,4000);}
  await applyDictation(out);
}

async function applyDictation(out){
  const saved=[];
  for(const r of(out.service_records||[])){
    const needs=r.needs_review||!r.bike_id;
    const{data}=await db.from('mc_service_records').insert({
      bike_id:r.bike_id||null,odometer_km:r.odometer_km??null,work_done:r.work_done,
      raw_transcript:out.transcript,needs_review:needs,created_by:user.code,
    }).select().single().then(x=>x,()=>({data:null}));
    if(data)saved.push({type:'Servis',t:r.work_done,needs,table:'mc_service_records',id:data.id});
  }
  for(const t of(out.todos||[])){
    const needs=t.needs_review||!t.bike_id;
    const{data}=await db.from('mc_todos').insert({
      bike_id:t.bike_id||null,task:t.task,raw_transcript:out.transcript,needs_review:needs,created_by:user.code,
    }).select().single().then(x=>x,()=>({data:null}));
    if(data)saved.push({type:'Úkol',t:t.task,needs,table:'mc_todos',id:data.id});
  }
  // splněné úkoly — pokus o automatické odškrtnutí
  for(const d of(out.todo_done||[])){
    const cand=openTodos().filter(t=>!d.bike_id||t.bike_id===d.bike_id);
    const words=(d.match_hint||'').toLowerCase().split(/\W+/).filter(w=>w.length>3);
    const hit=cand.filter(t=>words.some(w=>t.task.toLowerCase().includes(w)));
    if(hit.length===1){
      await db.from('mc_todos').update({done:true,done_at:new Date().toISOString(),done_by:user.code}).eq('id',hit[0].id);
      saved.push({type:'Hotový úkol ✓',t:hit[0].task,needs:false});
    }
  }
  await loadAll();
  showResult(out.transcript,saved);
  render();
}
function showResult(transcript,saved){
  let h=`<h3>Zaznamenáno</h3><div class="mut small" style="margin-bottom:12px">„${esc(transcript)}"</div>`;
  if(!saved.length)h+=`<div class="card mut">Nerozpoznal jsem žádný záznam ani úkol. Zkus to nadiktovat znovu a zmínit motorku.</div>`;
  for(const s of saved){
    h+=`<div class="card"><div class="row">
      <div class="grow"><span class="badge ${s.needs?'warn':'grn'}">${s.type}${s.needs?' · ověřit':''}</span><div style="margin-top:6px">${esc(s.t)}</div></div>
      ${s.table?`<button class="btn sm ghost" style="color:var(--red)" onclick="undoSaved('${s.table}','${s.id}',this)">Smazat</button>`:''}
    </div></div>`;
  }
  h+=`<button class="btn full" onclick="closeSheet()">OK</button>`;
  sheet(h);
}
async function undoSaved(table,id,btn){
  await db.from(table).delete().eq('id',id);
  btn.closest('.card').remove();await loadAll();render();toast('Smazáno');
}

/* ---------- boot ---------- */
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const savedU=localStorage.getItem('mc_user');
if(savedU){user=JSON.parse(savedU);enter();}
</script>
